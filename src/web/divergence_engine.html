<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divergence Engine</title>
  <link rel="stylesheet" href="/de/static/css/divergence_engine.css">
  <script src="https://unpkg.com/lightweight-charts@5.1.0/dist/lightweight-charts.standalone.production.js"></script>
</head>

<body>
  <div class="hdr">
    <div class="hdr-left">
      <h1>Divergence Engine &mdash; <span id="ticker-label"></span></h1>
      <span class="sub">Multi-Anchor Rolling Window Analysis</span>
    </div>
    <div class="win-toggles">
      <!-- Aggregation mode -->
      <div class="pill-grp agg-mode-grp">
        <button class="pill agg-btn active" data-mode="daily" title="Daily">D</button>
        <button class="pill agg-btn" data-mode="weekly" title="Weekly">W</button>
        <button class="pill agg-btn" data-mode="monthly" title="Monthly">M</button>
      </div>
      <!-- Price overlays -->
      <div class="pill-grp">
        <label class="pill ov-cwvap"><input type="checkbox" id="cbCWVAP" checked><span>CWVAP</span></label>
        <label class="pill ov-cpoc"><input type="checkbox" id="cbCPOC" checked><span>CPOC</span></label>
        <label class="pill ov-vol"><input type="checkbox" id="cbVol" checked><span>Vol</span></label>
      </div>
      <!-- Marker Legend -->
      <div class="marker-legend">
        <div class="leg-group leg-bull">
          <div class="leg-item"><span class="dot st-demand"></span><span>Demand</span></div>
        </div>
        <div class="leg-group leg-bear">
          <div class="leg-item"><span class="dot st-supply"></span><span>Supply</span></div>
        </div>
      </div>
    </div>
    <div id="last-data-date" class="data-date-display" title="Last NSE Data Download Date"></div>
    <button id="wl-add-active" class="settings-btn" title="Add Active Stock to Watchlist" disabled>+</button>
    <a href="/de/signal-quality" class="help-btn" title="Signal Quality Explorer" style="font-size:11px; font-weight:600;">SQ</a>
    <a href="/de/help" class="help-btn" title="Help Guide — Markers &amp; Trends Reference">?</a>
    <button id="open-settings" class="settings-btn" title="Engine Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3" />
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </svg>
    </button>
    <button id="toggle-sidebar" class="sidebar-btn" title="Toggle Sidebar Information">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 19l7-7-7-7" />
      </svg>
    </button>
  </div>

  <div class="main-wrapper">
    <div class="chart-area" id="chart-container">
      <div id="p1" class="panel p-main">
        <div id="leg1" class="legend"></div>
      </div>
      <!-- Dynamic sub-panels will be injected here by JS -->
    </div>

    <aside class="sidebar" id="sidebar">
      <!-- Symbol Search -->
      <div class="sidebar-section">
        <h3>Symbol Search</h3>
        <div class="search-container">
          <input type="text" id="symbol-input" placeholder="Search Symbol or Name..." autocomplete="off">
          <div id="search-results" class="search-dropdown"></div>
        </div>
      </div>

      <!-- Engine State (moved above watchlist) -->
      <div class="sidebar-section sidebar-bottom">
        <h3>Engine State</h3>
        <div id="sidebar-annotations">
          <table class="ann-table" id="state-table">
            <!-- Populated by JS -->
          </table>
          <div id="gate-diagnostics">
            <!-- Gate pass/fail diagnostics populated by JS -->
          </div>
        </div>
      </div>

      <!-- Watchlist Management -->
      <div id="watchlist-manager" class="sidebar-section">
        <div class="wl-header" style="margin-bottom: 4px;">
          <h3>Watchlist</h3>
        </div>
        <div class="wl-actions" style="position:relative; margin-bottom: 8px;">
          <button id="wl-sort-menu-trigger" title="Sort Watchlist">⇅</button>
          <div id="wl-sort-dropdown" class="search-dropdown wl-sort-dropdown"
            style="right:auto; left:0; width:130px; font-size:12px">
            <div class="search-item sort-btn active" data-sort="date-desc">Date (Newest)</div>
            <div class="search-item sort-btn" data-sort="date-asc">Date (Oldest)</div>
            <div class="search-item sort-btn" data-sort="name-asc">Name (A-Z)</div>
            <div class="search-item sort-btn" data-sort="name-desc">Name (Z-A)</div>
          </div>
          <button id="wl-add" title="Create New Watchlist">+</button>
          <button id="wl-rename" title="Rename Current Watchlist">✎</button>
          <button id="wl-set-default" title="Set as Default Watchlist">★</button>
          <button id="wl-delete" title="Delete Current Watchlist">🗑</button>
          <button id="wl-import" title="Import from Index">↓</button>
          <button id="wl-download" title="Download Watchlist">💾</button>
          <div id="wl-import-dropdown" class="search-dropdown wl-sort-dropdown"
            style="right:auto; left:0; width:220px; font-size:12px; max-height:400px; overflow-y:auto;">
            <!-- Populated by JS -->
          </div>
        </div>
        <div class="wl-selection-row" style="margin-bottom:8px">
          <select id="wl-select">
            <option value="">Select Watchlist</option>
          </select>
        </div>
        <div id="wl-items" class="wl-items-list">
          <!-- Populated by JS -->
        </div>
      </div>
    </aside>
  </div>

  <div id="loading" class="loading">Loading Engine Data...</div>
  <div id="tooltip" class="tooltip"></div>

  <!-- Settings Modal -->
  <div id="settings-overlay" class="settings-overlay hidden">
    <div class="settings-modal">
      <div class="settings-hdr">
        <h2>⚙ Engine Settings</h2>
        <button id="settings-close" class="settings-close-btn">&times;</button>
      </div>
      <div class="settings-tabs">
        <button class="settings-tab active" data-target="settings-thresholds">Thresholds</button>
        <button class="settings-tab" data-target="settings-panels">Panels</button>
      </div>
      <div class="settings-body" id="settings-thresholds">
        <!-- Populated by JS (Thresholds) -->
      </div>
      <div class="settings-body hidden" id="settings-panels">
        <div class="setting-group">
          <h4>Active Panels</h4>
          <div id="active-panels-list" class="panels-list">
            <!-- Populated by JS -->
          </div>
          <div class="add-panel-controls">
            <select id="add-panel-select">
              <!-- Populated by JS -->
            </select>
            <button id="add-panel-btn" class="btn btn-secondary">Add Panel</button>
          </div>
        </div>
      </div>
      <div class="settings-footer">
        <button id="settings-reset" class="btn btn-danger">Factory Reset</button>
        <div class="settings-footer-right">
          <button id="settings-cancel" class="btn btn-secondary">Cancel</button>
          <button id="settings-save" class="btn btn-primary">Save & Reload</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/de/static/js/divergence_engine.js"></script>
</body>

</html>
