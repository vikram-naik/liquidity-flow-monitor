<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divergence Engine</title>
  <link rel="stylesheet" href="/lfm/static/css/divergence_engine.css">
  <script src="https://unpkg.com/lightweight-charts@5.1.0/dist/lightweight-charts.standalone.production.js"></script>
</head>

<body>
  <div class="hdr">
    <div class="hdr-left">
      <h1>Divergence Engine &mdash; <span id="ticker-label"></span></h1>
      <span class="sub">Multi-Anchor Rolling Window Analysis</span>
    </div>
    <div class="win-toggles">
      <!-- Price overlays -->
      <div class="pill-grp">
        <label class="pill ov-cwvap"><input type="checkbox" id="cbCWVAP" checked><span>CWVAP</span></label>
        <label class="pill ov-cpoc"><input type="checkbox" id="cbCPOC" checked><span>CPOC</span></label>
        <label class="pill ov-vol"><input type="checkbox" id="cbVol" checked><span>Vol</span></label>
      </div>
      <!-- Marker Legend -->
      <div class="marker-legend">
        <div class="leg-item"><span class="dot st-vbtm"></span><span>V-Btm</span></div>
        <div class="leg-item"><span class="dot st-brkout"></span><span>BrkOut</span></div>
        <div class="leg-item"><span class="dot st-early"></span><span>Early</span></div>
        <div class="leg-item"><span class="dot st-markup"></span><span>Markup</span></div>
        <div class="leg-item"><span class="dot st-stealth"></span><span>Stealth Acc</span></div>
        <div class="leg-item"><span class="dot st-exhaust"></span><span>Exhaust Warning</span></div>
        <div class="leg-item"><span class="dot st-top"></span><span>Top</span></div>
        <div class="leg-item"><span class="dot st-actdist"></span><span>Active Dist</span></div>
        <div class="leg-item"><span class="dot st-brkdwn"></span><span>BrkDwn</span></div>
        <div class="leg-item"><span class="dot st-mrkdwn"></span><span>MrkDwn</span></div>
        <div class="leg-item"><span class="dot st-dcb"></span><span>DCB</span></div>
      </div>
    </div>
    <a href="/lfm/help" class="help-btn" title="Help Guide — Markers &amp; Trends Reference">?</a>
    <button id="toggle-sidebar" class="sidebar-btn" title="Toggle Sidebar Information">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 19l7-7-7-7" />
      </svg>
    </button>
  </div>

  <div class="main-wrapper">
    <div class="chart-area" id="chart-container">
      <div id="p1" class="panel p-main">
        <div id="leg1" class="legend"></div>
      </div>
      <div id="p2" class="panel p-sub">
        <div id="leg2" class="legend"></div>
      </div>
      <div id="p3" class="panel p-sub">
        <div id="leg3" class="legend"></div>
      </div>
    </div>

    <aside class="sidebar" id="sidebar">
      <!-- NEW: Symbol Search & Typeahead -->
      <div class="sidebar-section">
        <h3>Symbol Search</h3>
        <div class="search-container">
          <input type="text" id="symbol-input" placeholder="Search Symbol or Name..." autocomplete="off">
          <div id="search-results" class="search-dropdown"></div>
        </div>
      </div>

      <!-- NEW: Watchlist Management -->
      <div id="watchlist-manager" class="sidebar-section">
        <div class="wl-header">
          <h3>Watchlist</h3>
          <div class="wl-actions">
            <button id="wl-add" title="Create New Watchlist">+</button>
            <button id="wl-rename" title="Rename Current Watchlist">✎</button>
            <button id="wl-delete" title="Delete Current Watchlist">🗑</button>
            <button id="wl-import" title="Import from Index">↓</button>
            <button id="wl-download" title="Download Watchlist">💾</button>
          </div>
        </div>
        <div class="wl-sort-controls">
          <select id="wl-sort">
            <option value="date-desc">Date (Newest)</option>
            <option value="date-asc">Date (Oldest)</option>
            <option value="name-asc">Name (A-Z)</option>
            <option value="name-desc">Name (Z-A)</option>
          </select>
        </div>
        <select id="wl-select">
          <option value="">Select Watchlist</option>
        </select>
        <div id="wl-items" class="wl-items-list">
          <!-- Populated by JS -->
        </div>
      </div>

      <div class="sidebar-section sidebar-bottom">
        <h3>Engine State</h3>
        <div id="sidebar-annotations">
          <table class="ann-table" id="state-table">
            <!-- Populated by JS -->
          </table>
        </div>
      </div>
    </aside>
  </div>

  <div id="loading" class="loading">Loading Engine Data...</div>
  <div id="tooltip" class="tooltip"></div>

  <script src="/lfm/static/js/divergence_engine.js"></script>
</body>

</html>
