<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Money Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>
    <link rel="stylesheet" href="static/css/dashboard.css?v=6">
</head>

<body>

    <!-- ── App Container (Sidebar + Main) ────────────────── -->
    <div id="app-container">

        <!-- ── Sidebar ───────────────────────────────────────── -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <h1>Smart Money</h1>
            </div>

            <!-- Symbol Search -->
            <div class="symbol-search">
                <input type="text" id="symbol-input" placeholder="Search Symbol…" value="GESHIP">
                <button onclick="loadSymbol()">Go</button>
            </div>

            <!-- Watchlist Section -->
            <div class="watchlist-section">
                <div class="wl-header">
                    <span class="wl-title">WATCHLIST</span>
                    <div class="dropdown">
                        <button class="icon-btn" onclick="toggleWlMenu(event)">⋮</button>
                        <div id="wl-menu" class="dropdown-content">
                            <button onclick="watchlistManager.createList()">+ New List</button>
                            <div class="menu-divider"></div>
                            <div class="menu-label">Indices / Templates</div>
                            <div id="wl-menu-indices" class="menu-scroll">
                                <!-- Dynamic indices injected here -->
                            </div>
                            <div class="menu-divider"></div>
                            <button onclick="watchlistManager.renameCurrent()">✎ Rename List</button>
                            <button class="danger" onclick="watchlistManager.deleteCurrent()">🗑 Delete List</button>
                        </div>
                    </div>
                </div>

                <select id="wl-selector" onchange="watchlistManager.switchList(this.value)">
                    <option value="" disabled selected>Loading...</option>
                </select>

                <div id="wl-items" class="wl-list">
                    <!-- Items injected here -->
                    <div class="wl-empty">Select or create a watchlist</div>
                </div>
            </div>

        </aside>

        <!-- ── Main Content ──────────────────────────────────── -->
        <main id="main-content">
            <!-- Header (Reduced) -->
            <header id="top-bar">
                <div style="display:flex; align-items:center; gap:12px;">
                    <button class="icon-btn" onclick="toggleSidebar()" style="font-size:20px;">☰</button>
                    <h2
                        style="font-size:16px; font-weight:700; background:linear-gradient(135deg,var(--purple),var(--blue)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;">
                        Smart Money</h2>
                </div>

                <div class="controls">
                    <div class="ctrl-group">
                        <label>Agg</label>
                        <div class="btn-group" id="ctrl-agg">
                            <button class="tbtn active" data-val="daily" onclick="switchTbtn(this)">D</button>
                            <button class="tbtn" data-val="weekly" onclick="switchTbtn(this)">W</button>
                            <button class="tbtn" data-val="monthly" onclick="switchTbtn(this)">M</button>
                        </div>
                    </div>
                </div>

                <div id="metrics">
                    <div class="metric" id="m-legends"
                        style="flex-direction: row; align-items: center; justify-content: center; gap: 12px; padding: 0 14px;">
                        <div class="legend-tag" style="margin: 0;">
                            <div class="dot" style="background:var(--blue);"></div>DAVWAP
                        </div>
                        <div class="legend-tag" style="margin: 0;">
                            <div class="dot" style="background:var(--gold);"></div>Ledger
                        </div>
                        <div class="legend-tag" style="margin: 0;">
                            <div class="dot" style="background:#ffd43b; border-radius: 0; height: 2px;"></div>POC
                        </div>
                        <div class="legend-tag" style="margin: 0;">
                            <div class="dot"
                                style="background:#b197fc; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); border-radius: 0;">
                            </div>Ignition
                        </div>
                        <div class="legend-tag" style="margin: 0;">
                            <div class="dot"
                                style="background:#ffd43b; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); border-radius: 0;">
                            </div>Breakout
                        </div>
                        <div class="legend-tag" style="margin: 0;">
                            <div class="dot"
                                style="background:#ffd43b; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); border-radius: 0;">
                            </div>Bounce
                        </div>
                        <div class="legend-tag" style="margin: 0;">
                            <div class="dot" style="background:#4dabf7;"></div>Coil
                        </div>
                    </div>
                    <div class="metric" id="m-price">
                        <div style="display:flex; justify-content:space-between; align-items: center; width: 100%;">
                            <span class="label">Price</span>
                            <button class="text-btn"
                                style="color:var(--green); font-size:14px; line-height:1; padding-left:12px;"
                                onclick="watchlistManager.addToCurrent(document.getElementById('symbol-input').value)"
                                title="Add to Watchlist">+</button>
                        </div>
                        <span class="value" id="m-price-val">—</span>
                        <span class="sub" id="m-price-sub"></span>
                    </div>
                    <div class="metric" id="m-anchor">
                        <span class="label">Anchor</span>
                        <div style="display:flex; align-items:center;">
                            <span class="value" id="m-anchor-val" style="font-size:13px;">—</span>
                            <button id="btn-set-anchor" class="icon-btn" onclick="toggleAnchorMode()"
                                title="Set Manual Anchor (Monthly Only)"
                                style="font-size:14px; margin-left:6px; display:none;">⚓</button>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Charts -->
            <div id="chart-area" style="display: flex; flex-direction: column; height: 100%;">
                <!-- Pane 0: Price & Volume & DAVWAP -->
                <div style="flex: 3; display:flex; flex-direction:column; overflow: hidden; min-height: 250px;">
                    <div class="chart-row" id="price-row"
                        style="flex: 1; position:relative; overflow: hidden; border-top-left-radius:6px; border-top-right-radius:6px;">
                        <div class="chart-label">Price &amp; Delivery Volume</div>
                        <div class="symbol-watermark" id="symbol-display"></div>
                        <div id="price-chart" style="position:absolute; inset:0;"></div>
                    </div>
                </div>

                <!-- Pane 1: Ledger -->
                <div style="flex: 1; display:flex; flex-direction:column; min-height: 150px; overflow: hidden;">
                    <div class="chart-row" id="ledger-row" style="flex: 1; position:relative; overflow: hidden;">
                        <div class="chart-label">Momentum Ledger</div>
                        <div id="ledger-chart" style="position:absolute; inset:0;"></div>
                    </div>
                </div>

                <!-- Pane 2: MCS -->
                <div style="flex: 1; display:flex; flex-direction:column; min-height: 150px; overflow: hidden;">
                    <div class="chart-row" id="mcs-row"
                        style="flex: 1; position:relative; overflow: hidden; border-bottom-left-radius:6px; border-bottom-right-radius:6px;">
                        <div class="chart-label">MCS (30D Correlation)</div>
                        <div id="mcs-chart" style="position:absolute; inset:0;"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Loading Overlay -->
    <div id="loading">
        <div class="spinner"></div>
    </div>
    <!-- Toast -->
    <div id="toast"></div>


    <script src="static/js/dashboard.js"></script>
</body>

</html>
