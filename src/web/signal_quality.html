<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal Quality Explorer</title>
  <link rel="stylesheet" href="/de/static/css/signal_quality.css">
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@35.1.0/dist/ag-grid-community.min.js"></script>
</head>

<body>
  <header class="sq-header">
    <div class="sq-header-left">
      <h1>Signal Quality Explorer</h1>
      <span class="sq-sub">Demand/Supply Marker Analysis</span>
    </div>
    <div class="sq-header-right">
      <label for="run-select">Run:</label>
      <select id="run-select"><option value="">Loading...</option></select>
      <span id="signal-count" class="sq-badge">0 signals</span>
      <div class="sq-page-controls">
        <button id="page-prev" class="sq-page-btn" disabled>&laquo;</button>
        <span id="page-info" class="sq-page-info">-</span>
        <button id="page-next" class="sq-page-btn">&raquo;</button>
      </div>
      <a href="/de/dashboard/RELIANCE" class="sq-back-btn" title="Back to Chart">&larr; Chart</a>
    </div>
  </header>

  <!-- Server-side filter bar -->
  <div class="sq-filter-bar" id="filter-bar">
    <div class="sq-filter-group">
      <span class="sq-filter-label">Type:</span>
      <button class="sq-filter-btn sq-filter-type active" data-type="">All</button>
      <button class="sq-filter-btn sq-filter-type" data-type="Demand">Demand</button>
      <button class="sq-filter-btn sq-filter-type" data-type="Supply">Supply</button>
    </div>
    <div class="sq-filter-group">
      <span class="sq-filter-label">Tier:</span>
      <button class="sq-filter-btn sq-filter-tier active" data-tier="">All</button>
      <button class="sq-filter-btn sq-filter-tier" data-tier="Large">Large</button>
      <button class="sq-filter-btn sq-filter-tier" data-tier="Mid">Mid</button>
      <button class="sq-filter-btn sq-filter-tier" data-tier="Small">Small</button>
      <button class="sq-filter-btn sq-filter-tier" data-tier="Micro">Micro</button>
    </div>
    <div class="sq-filter-group">
      <span class="sq-filter-label">5d Result:</span>
      <button class="sq-filter-btn sq-filter-hit active" data-hit="">All</button>
      <button class="sq-filter-btn sq-filter-hit" data-hit="1">Hits</button>
      <button class="sq-filter-btn sq-filter-hit" data-hit="0">Misses</button>
    </div>
  </div>

  <div class="sq-summary" id="summary-panel">
    <!-- Populated by JS -->
  </div>

  <div class="sq-grid-wrapper">
    <div id="signal-grid" class="ag-theme-alpine-dark sq-grid"></div>
  </div>

  <script src="/de/static/js/signal_quality.js"></script>
</body>

</html>
