# Conviction-Gated Marker System — Default Configuration
#
# Two markers (Demand / Supply) with conviction gates and scoring.
# User overrides are stored in the database (user_settings table).

# ----------------------------------------------------------------
# Tunable Thresholds
# ----------------------------------------------------------------
thresholds:
  # Conviction Gates
  cwc_gate: 0.65            # CWC must be <= this for a signal
  rdv_gate: 0.6             # RDV must be >= this for a signal
  rdv_consistency_gate: 2   # Days with above-avg delivery in last 5

  # Conviction Score Weights (must sum to 1.0)
  w_cwc: 0.25
  w_rdv: 0.20
  w_rdv_consistency: 0.15
  w_cwvap_depth: 0.15
  w_delivery_pct: 0.10
  w_pdd: 0.15

  # Verification
  verification_horizon: 5     # Trading days to look forward
  verification_atr_mult: 2.0  # ATR multiplier for target barrier

# ----------------------------------------------------------------
# Classification Rules (evaluated in priority order, first match wins)
# ----------------------------------------------------------------
rules:
  - name: "Demand"
    priority: 10
    conditions:
      cwvap_dist: { max: 0 }
      cwc: { max: "$cwc_gate" }
      rdv: { min: "$rdv_gate" }
      rdv_consistency: { min: "$rdv_consistency_gate" }

  - name: "Supply"
    priority: 20
    conditions:
      cwvap_dist: { min: 0 }
      cwc: { max: "$cwc_gate" }
      rdv: { min: "$rdv_gate" }
      rdv_consistency: { min: "$rdv_consistency_gate" }
