# Unified Weighted Scoring Model — Default Configuration (v2)
#
# Replaces binary gates with continuous scoring. Each factor contributes
# a score (0-1) via a registered scoring function. Weighted sum produces
# signal_strength (0-100). Signal fires if >= min_signal_strength.

schema_version: 2

# ----------------------------------------------------------------
# Global Settings
# ----------------------------------------------------------------
settings:
  min_signal_strength: 40          # 0-100, minimum to fire a signal
  va_pct: 0.70                     # delivery-profile VA: fraction of delivery volume
  delta_windows:
    psz_delta: [2, 4, 9]           # rolling diff periods for PSZ Delta
    rsz_delta: [2, 4, 9]           # rolling diff periods for RSZ Delta
    mcs_delta: [2, 4, 9]           # rolling diff periods for MCS Delta
  regime:
    adx_length: 14
    adx_trend_entry: 25.0
    adx_trend_exit: 20.0
    min_di_gap: 2.0
    scores:
      counter_trend: 1.0    # Supply in uptrend, Demand in downtrend
      trend_aligned: 0.3    # Demand in uptrend, Supply in downtrend
      transition: 0.5
      notrend: 0.15
  convergence:
    delta_families:
      psz: [psz_delta_2d, psz_delta_4d, psz_delta_9d]
      rsz: [rsz_delta_2d, rsz_delta_4d, rsz_delta_9d]
      mcs: [mcs_delta_2d, mcs_delta_4d, mcs_delta_9d]
    threshold: 0.3            # minimum score for a family to count
    multipliers:
      0: 0.85
      1: 1.0
      2: 1.10
      3: 1.20

# ----------------------------------------------------------------
# Scoring Factors
# ----------------------------------------------------------------
# Each factor maps a DataFrame column to a continuous 0-1 score.
# Weights are per-direction (demand/supply) and will be normalised.
#
# scoring: name of a registered scoring function in functions.py
# normalize: parameters passed to the scoring function
# requires: { factor: X } — child capped by parent's score
#           { any: [X, Y] } — child capped by max(parent scores)
# weight: per-direction weights (higher = more important)
# ui: metadata for auto-generated settings + sidebar display
# ----------------------------------------------------------------
# IMPORTANT: Factor order matters — parents must appear before children.
# Tier 1 (Primary):      psz_delta, rsz_delta  — inflection indicators
# Tier 2 (Level):        price_slope_z, rsz    — requires respective delta
# Tier 3 (Confirmation): cwc, coherence          — requires any delta
# Tier 4 (Context):      regime_alignment      — standalone
# ----------------------------------------------------------------
factors:
  # --- Tier 1: Primary (deltas — no requirements) ---
  psz_delta_2d:
    column: psz_delta_2d
    scoring: directional
    normalize:
      max_value: 0.15
      exponent: 1.5
    weight:
      demand: 0.06
      supply: 0.06
    ui:
      label: "PSZ Δ (2d)"
      description: "Price slope inflection (2-day change)"
      format: ".3f"

  psz_delta_4d:
    column: psz_delta_4d
    scoring: directional
    normalize:
      max_value: 0.15
      exponent: 1.5
    weight:
      demand: 0.06
      supply: 0.06
    ui:
      label: "PSZ Δ (4d)"
      description: "Price slope inflection (4-day change)"
      format: ".3f"

  psz_delta_9d:
    column: psz_delta_9d
    scoring: directional
    normalize:
      max_value: 0.15
      exponent: 1.5
    weight:
      demand: 0.03
      supply: 0.03
    ui:
      label: "PSZ Δ (9d)"
      description: "Price slope inflection (9-day change)"
      format: ".3f"

  rsz_delta_2d:
    column: rsz_delta_2d
    scoring: directional
    normalize:
      max_value: 0.15
      exponent: 1.5
    weight:
      demand: 0.04
      supply: 0.04
    ui:
      label: "RSZ Δ (2d)"
      description: "Delivery slope inflection (2-day change)"
      format: ".3f"

  rsz_delta_4d:
    column: rsz_delta_4d
    scoring: directional
    normalize:
      max_value: 0.15
      exponent: 1.5
    weight:
      demand: 0.04
      supply: 0.04
    ui:
      label: "RSZ Δ (4d)"
      description: "Delivery slope inflection (4-day change)"
      format: ".3f"

  rsz_delta_9d:
    column: rsz_delta_9d
    scoring: directional
    normalize:
      max_value: 0.15
      exponent: 1.5
    weight:
      demand: 0.02
      supply: 0.02
    ui:
      label: "RSZ Δ (9d)"
      description: "Delivery slope inflection (9-day change)"
      format: ".3f"

  mcs_delta_2d:
    column: mcs_delta_2d
    scoring: directional
    normalize:
      max_value: 0.5
      exponent: 1.5
    weight:
      demand: 0.08
      supply: 0.08
    ui:
      label: "MCS Δ (2d)"
      description: "MCS momentum shift (2-day change)"
      format: ".3f"

  mcs_delta_4d:
    column: mcs_delta_4d
    scoring: directional
    normalize:
      max_value: 0.5
      exponent: 1.5
    weight:
      demand: 0.08
      supply: 0.08
    ui:
      label: "MCS Δ (4d)"
      description: "MCS momentum shift (4-day change)"
      format: ".3f"

  mcs_delta_9d:
    column: mcs_delta_9d
    scoring: directional
    normalize:
      max_value: 0.5
      exponent: 1.5
    weight:
      demand: 0.04
      supply: 0.04
    ui:
      label: "MCS Δ (9d)"
      description: "MCS momentum shift (9-day change)"
      format: ".3f"

  # --- Tier 2: Level (requires own delta) ---
  price_slope_z:
    column: price_slope_z
    scoring: abs_higher_is_better
    normalize:
      max_value: 0.4
      exponent: 1.3
    # requires:
    #   factor: psz_delta
    weight:
      demand: 0.15
      supply: 0.15
    ui:
      label: "PSZ"
      description: "Price slope z-score (Demand: falling, Supply: rising)"
      format: ".2f"

  rsz:
    column: rdv_slope_z
    scoring: abs_higher_is_better
    normalize:
      max_value: 0.4
      exponent: 1.3
    # requires:
    #   factor: rsz_delta
    weight:
      demand: 0.10
      supply: 0.10
    ui:
      label: "RSZ"
      description: "Delivery slope z-score (rising = institutional participation)"
      format: ".2f"

  # --- Tier 3: Confirmation (requires any delta) ---
  cwc:
    column: cwc
    scoring: lower_is_better
    normalize:
      ref_value: 1.0
    requires:
      any: [
        psz_delta_2d, psz_delta_4d, psz_delta_9d,
        rsz_delta_2d, rsz_delta_4d, rsz_delta_9d,
        mcs_delta_2d, mcs_delta_4d, mcs_delta_9d
      ]
    weight:
      demand: 0.05
      supply: 0.05
    ui:
      label: "CWC"
      description: "Cross-Window Coherence (lower = more coherent)"
      format: ".2f"

  coherence:
    column: coherence
    scoring: higher_is_better
    normalize:
      max_value: 1.0
    requires:
      any: [
        psz_delta_2d, psz_delta_4d, psz_delta_9d,
        rsz_delta_2d, rsz_delta_4d, rsz_delta_9d,
        mcs_delta_2d, mcs_delta_4d, mcs_delta_9d
      ]
    weight:
      demand: 0.05
      supply: 0.05
    ui:
      label: "Coherence"
      description: "Multi-timeframe trend alignment"
      format: ".2f"

  # pdd: DISABLED — negatively correlated with returns (r=-0.043).
  #   Q4 (highest PDD) has worst hit rate: 46.2% overall, 37.6% Supply.
  #   Extreme divergence is a trap, not a signal.
  # pdd:
  #   column: pdd_30
  #   scoring: abs_higher_is_better
  #   normalize:
  #     max_value: 20.0
  #   requires:
  #     any: [psz_delta, rsz_delta]
  #   weight:
  #     demand: 0.15
  #     supply: 0.15
  #   ui:
  #     label: "PDD"
  #     description: "Price-Delivery Divergence (30d)"
  #     format: ".1f"

  # --- Tier 4: Context (standalone) ---
  cdvl:
    column: cdvl
    scoring: directional
    normalize:
      max_value: 0.15
    weight:
      demand: 0.10
      supply: 0.10
    ui:
      label: "CDVL"
      description: "Composite Delivery Velocity (Macro momentum)"
      format: ".2f"

  delivery_phase:
    column: gradient_shape
    scoring: categorical_map
    normalize:
      demand_map:
        accumulation: 1.0
        recovering: 0.8
        uptrend_forming: 0.6
        uptrend_mature: 0.5
        sideways: 0.5
        distribution: 0.0
      supply_map:
        distribution: 1.0
        downtrend_forming: 0.8
        downtrend_mature: 0.5
        uptrend_exhausting: 0.5
        sideways: 0.5
        accumulation: 0.0
    weight:
      demand: 0.05
      supply: 0.05
    ui:
      label: "Volume Phase"
      description: "Macro gradient tracking across 10-120d volume cycles"
      format: "s"

  regime_alignment:
    column: regime_score
    scoring: higher_is_better
    normalize:
      max_value: 1.0
    weight:
      demand: 0.05
      supply: 0.05
    ui:
      label: "Regime"
      description: "ADX/DMI trend alignment (uptrend/downtrend=1.0, transition=0.5, notrend=0.15)"
      format: ".2f"

# ----------------------------------------------------------------
# Cumulative Evidence Index (CEI)
# ----------------------------------------------------------------
# Rolling net-directional-evidence score.
# Positive → Demand evidence building (accumulation)
# Negative → Supply evidence building (distribution)
cei:
  ema_span: 10                    # trading days for EMA smoothing
  slope_window: 5                 # bars for CEI slope (linreg)
  # CEI-based markers (Phase 3) — slope zero-crossings + cooldown
  markers:
    cooldown_bars: 5                # no repeat marker within N bars
    supply_below_cwvap: true        # Supply only fires when close < cwvap
  # RSZ–PSZ per-window confirmation: dampen RSZ when PSZ disagrees in sign
  rsz_psz_confirmation:
    dampening: 0.2                  # RSZ contribution × 0.2 when signs disagree
    pairs:
      rsz_delta_2d: psz_delta_2d
      rsz_delta_4d: psz_delta_4d
      rsz_delta_9d: psz_delta_9d
  structure_multiplier:
    coherence_floor: 0.5          # min multiplier from coherence (0.5 → 1.0)
    cwc_floor: 0.5                # min multiplier from CWC (0.5 → 1.0)
  # Position score — CWVAP/CPOC price-position awareness (10%)
  # Prevents false positives when delivery divergence is real but price
  # is deep below institutional cost basis. Sweet spot: -3% to 0% below CWVAP.
  position_score:
    weight: 0.05
  # VA Spring Energy — stored institutional energy from range containment (5%)
  # Tracks how long price was inside VA (CVAL–CVAH), converts to directional
  # evidence on breakout. Score = dwell × breakout, normalised.
  va_spring:
    spring_threshold: 0.20          # min spring score to bypass EMA and use cei_raw
    dwell_window: 60                # bars to look back for VA containment
    saturation_pct: 3.0             # breakout % at which direction saturates
    max_value: 2.0                  # spring score normalisation (P90 of Nifty 50)
    cwvap_sweet_lo: -3.0          # lower bound of sweet spot (%)
    cwvap_sweet_peak: -1.5        # peak of sweet spot (%)
    cwvap_decay_hi: 6.0           # above this % → capped at -0.5
    cwvap_deep_lo: -6.0           # below this → rapid decay
    cwvap_deep_floor: -12.0       # floor: score = -1.0
    cpoc_saturation_pct: 5.0      # CPOC ramp saturates at ±5%
    cwvap_blend: 0.6              # CWVAP component weight (CPOC = 1 - this)
  features:
    # Price momentum (15%) — max_value set at P90 of Nifty 50 distribution
    psz_delta_2d:  { weight: 0.06, max_value: 0.25 }
    psz_delta_4d:  { weight: 0.06, max_value: 0.45 }
    psz_delta_9d:  { weight: 0.03, max_value: 0.55 }
    # Delivery momentum (20%) — max_value set at P90 of Nifty 50 distribution
    rsz_delta_2d:  { weight: 0.08, max_value: 0.23 }
    rsz_delta_4d:  { weight: 0.08, max_value: 0.35 }
    rsz_delta_9d:  { weight: 0.04, max_value: 0.40 }
    # Money flow momentum (30%)
    mcs_delta_2d:  { weight: 0.12, max_value: 0.50 }
    mcs_delta_4d:  { weight: 0.12, max_value: 0.50 }
    mcs_delta_9d:  { weight: 0.06, max_value: 0.50 }
    # Cumulative Accumulation/Distribution divergence (15%) — rolling 20-bar sum
    cumul_divergence: { weight: 0.15, max_value: 0.35, window: 20 }
    # Macro volume (5%, reduced from 10% — position_score absorbs context role)
    cdvl:          { weight: 0.05, max_value: 0.15 }
    # Directional levels (10%)
    psz_level:     { weight: 0.05, max_value: 0.40 }
    rsz_level:     { weight: 0.05, max_value: 0.40 }

# ----------------------------------------------------------------
# Legacy v1 keys (kept for config_manager override compatibility)
# ----------------------------------------------------------------
thresholds: {}
rules: []
